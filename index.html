<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pourashava Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --bg: #f1f4fa;
        --cd: #fff;
        --tx: #0f172a;
        --mu: #64748b;
        --bd: #e3e8f2;
        --ac: #4f46e5;
        --sh:
          0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1020;
          --cd: #141b30;
          --tx: #e8ecf7;
          --mu: #93a0bd;
          --bd: #232c47;
          --ac: #818cf8;
          --sh: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1020;
        --cd: #141b30;
        --tx: #e8ecf7;
        --mu: #93a0bd;
        --bd: #232c47;
        --ac: #818cf8;
        --sh: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.45 Inter,
          system-ui,
          "Segoe UI",
          Arial,
          sans-serif;
      }
      .app {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        background: #0f172a;
        color: #cbd5e1;
        padding: 18px 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 6px;
      }
      .brand b {
        color: #fff;
        display: block;
      }
      .brand small {
        color: #94a3b8;
      }
      .logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(135deg, #4f46e5, #ec4899);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
      }
      .nv {
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: 0;
        color: #cbd5e1;
        padding: 9px 10px;
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .nv:hover {
        background: #1e293b;
      }
      .nv.on {
        background: #4f46e5;
        color: #fff;
      }
      .nv b {
        margin-left: auto;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 99px;
        padding: 1px 8px;
      }
      .side-f {
        display: grid;
        gap: 6px;
      }
      .b2 {
        background: #1e293b;
        color: #e2e8f0;
        border: 0;
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .b2:hover {
        background: #334155;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 18px 22px 0;
      }
      h1 {
        font-size: 21px;
        margin: 0;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .mu {
        color: var(--mu);
      }
      .tr {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      main {
        padding: 16px 22px 40px;
        display: grid;
        gap: 14px;
      }
      .btn {
        border: 1px solid var(--bd);
        background: var(--cd);
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--ac);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pri {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px 10px;
        width: 100%;
      }
      #q {
        width: 240px;
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--sh);
        min-width: 0;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .kp {
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        padding: 14px;
      }
      .kp:hover {
        border-color: var(--c);
      }
      .kp::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--c);
      }
      .kp .ic {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-size: 18px;
        background: color-mix(in srgb, var(--c) 16%, transparent);
      }
      .kp b {
        font-size: 22px;
        display: block;
        line-height: 1.1;
      }
      .kp small {
        color: var(--mu);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .w2 {
        grid-column: span 2;
      }
      .cv {
        position: relative;
        height: 260px;
      }
      .ch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .ch h2 {
        margin: 0;
      }
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tools select {
        width: auto;
        min-width: 130px;
      }
      .sc {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        color: var(--mu);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 8px 10px;
        border-bottom: 1px solid var(--bd);
        white-space: nowrap;
      }
      th.s {
        cursor: pointer;
      }
      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--bd);
        vertical-align: top;
      }
      tr:hover td {
        background: color-mix(in srgb, var(--bd) 25%, transparent);
      }
      .rm {
        max-width: 320px;
        color: var(--mu);
      }
      .ra {
        text-align: right;
        white-space: nowrap;
      }
      .ra button {
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--tx);
        padding: 2px 6px;
        border-radius: 6px;
      }
      .ra button:hover {
        background: var(--bd);
      }
      .chip,
      .pill {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 99px;
        font-size: 11.5px;
        font-weight: 700;
        background: color-mix(in srgb, var(--c) 16%, transparent);
        color: var(--c);
        white-space: nowrap;
      }
      .pg {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .rc {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
        flex-wrap: wrap;
      }
      .rc:last-child {
        border: 0;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(8, 12, 28, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 9;
      }
      .ov[hidden] {
        display: none;
      }
      .mod {
        background: var(--cd);
        border-radius: 16px;
        padding: 20px;
        width: min(560px, 100%);
        max-height: 92vh;
        overflow: auto;
        border: 1px solid var(--bd);
      }
      .fg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .fg label {
        display: grid;
        gap: 4px;
        font-weight: 600;
        font-size: 12.5px;
      }
      .fg .f {
        grid-column: 1/-1;
      }
      .mb {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 30px);
        background: #111827;
        color: #fff;
        padding: 10px 16px;
        border-radius: 12px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 10;
        max-width: 92vw;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      #toast button {
        margin-left: 10px;
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 3px 10px;
        cursor: pointer;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
        }
        nav {
          flex-direction: row;
          overflow-x: auto;
          flex: 1 1 100%;
          order: 3;
        }
        .nv {
          white-space: nowrap;
        }
        .side-f {
          grid-auto-flow: column;
          order: 2;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .w2 {
          grid-column: auto;
        }
        #q {
          width: 100%;
        }
        .top,
        main {
          padding-left: 14px;
          padding-right: 14px;
        }
      }
      .gl {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #64748b;
        padding: 10px 10px 2px;
      }
      .flow {
        display: flex;
        height: 26px;
        border-radius: 8px;
        overflow: hidden;
        margin: 4px 0 14px;
        gap: 2px;
      }
      .flow i {
        display: grid;
        place-items: center;
        color: #fff;
        font: 700 12px inherit;
        font-style: normal;
      }
      .board {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(200px, 1fr);
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .col {
        background: color-mix(in srgb, var(--bd) 35%, transparent);
        border-radius: 12px;
        padding: 10px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 2px dashed transparent;
      }
      .col.ov2 {
        border-color: var(--ac);
      }
      .colh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        font-size: 13px;
      }
      .colh b {
        background: var(--c);
        color: #fff;
        border-radius: 99px;
        padding: 0 9px;
        font-size: 12px;
      }
      .tile {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-left: 4px solid var(--c);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        cursor: grab;
      }
      .tile.dg {
        opacity: 0.4;
      }
      .tile strong {
        display: block;
        margin-bottom: 4px;
      }
      .ia {
        display: flex;
        flex-direction: column;
        opacity: 0.5;
      }
      .tile:hover .ia {
        opacity: 1;
      }
      .ia button {
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--tx);
        padding: 2px 5px;
        border-radius: 6px;
      }
      .ia button:hover {
        background: var(--bd);
      }
      .cellb {
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--c) 18%, transparent);
        color: var(--c);
      }
      .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--bd);
        min-width: 90px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #0ea5e9, #10b981);
      }
      @media (max-width: 900px) {
        .gl {
          display: none;
        }
      }

      .bd {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }
      .stg {
        background: color-mix(in srgb, var(--bd) 28%, transparent);
        border-top: 3px solid var(--c);
        border-radius: 12px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .ph {
        display: grid;
        gap: 5px;
        padding: 2px 2px 4px;
      }
      .t1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 12.5px;
      }
      .t1 .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .t1 .num {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--c);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 10.5px;
        flex: none;
      }
      .t1 b {
        background: color-mix(in srgb, var(--c) 18%, transparent);
        color: var(--c);
        border-radius: 99px;
        padding: 0 8px;
        font-size: 11px;
      }
      .ph .bar {
        min-width: 0;
        height: 4px;
      }
      .ph .bar i {
        background: var(--c);
      }
      .lh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10.5px;
        color: var(--mu);
        margin: 2px 2px 0;
      }
      .lh .chip {
        font-size: 10.5px;
        padding: 0 7px;
      }
      .bd .col {
        min-height: 44px;
        padding: 4px;
        gap: 4px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--cd) 55%, transparent);
        border: 1.5px dashed transparent;
      }
      .bd .col.ov2 {
        border-color: var(--ac);
        background: color-mix(in srgb, var(--ac) 8%, transparent);
      }
      .bd .tile {
        position: relative;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        font-size: 12.5px;
        box-shadow: none;
      }
      .bd .tile .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .bd .tile .pill {
        font-size: 10.5px;
        padding: 0 7px;
      }
      .sd {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .bd .ia {
        flex-direction: row;
        opacity: 1;
        position: absolute;
        right: 3px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--cd);
        padding-left: 6px;
        display: none;
      }
      .bd .ia button {
        font-size: 12px;
        padding: 1px 4px;
      }
      .bd .tile:hover .ia {
        display: flex;
      }
      @media (hover: none) {
        .bd .ia {
          display: flex;
          position: static;
          transform: none;
          padding: 0;
        }
      }
      .e0 {
        color: var(--mu);
        opacity: 0.45;
        margin: auto;
        font-size: 12px;
      }
      @media (max-width: 1179px) {
        .bd {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        .bd {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 480px) {
        .bd {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <div class="logo">P</div>
          <div>
            <b>Pourashava Hub</b><small>MRAS + Migration Pipeline</small>
          </div>
        </div>
        <nav id="nav"></nav>
        <div class="side-f">
          <label class="b2"
            >⬆ Import .xlsx<input
              id="imp"
              type="file"
              accept=".xlsx,.xls"
              hidden /></label
          ><button class="b2" id="exp">⬇ Export .xlsx</button
          ><button class="b2" id="rst">↺ Reset data</button>
        </div>
      </aside>
      <div>
        <div class="top">
          <div>
            <h1 id="ttl"></h1>
            <span class="mu" id="sub"></span>
          </div>
          <div class="tr">
            <input
              id="q"
              placeholder="Search Pourashava, district, remarks…"
            /><button class="btn pri" id="add">＋ Add record</button>
          </div>
        </div>
        <main id="main"></main>
      </div>
    </div>
    <div class="ov" id="md" hidden>
      <div class="mod">
        <h2 id="mt"></h2>
        <div class="fg">
          <label>Division<input id="fdv" list="dvl" /></label
          ><label>District<input id="fds" list="dsl" /></label>
          <label>Pourashava<input id="fpz" /></label
          ><label>Tax database<select id="fmd"></select></label>
          <label>Sheet / status<select id="fc"></select></label
          ><label
            >Tax by LGCRRP<select id="flg">
              <option>Yes</option>
              <option>No</option>
            </select></label
          >
          <label>Package No.<input id="fpk" /></label
          ><label>Working / visit date<input id="fdt" type="date" /></label>
          <label>Follow-up date<input id="ffu" type="date" /></label
          ><label>Contact<input id="fcn" /></label>
          <label class="f"
            >Remarks<textarea id="frm" rows="3"></textarea>
          </label>
        </div>
        <datalist id="dvl"></datalist><datalist id="dsl"></datalist>
        <div class="mb">
          <button class="btn" id="cx">Cancel</button
          ><button class="btn pri" id="sv">Save</button>
        </div>
      </div>
    </div>
    <div class="ov" id="pm" hidden>
      <div class="mod" style="width: min(420px, 100%)">
        <h2 id="pmt"></h2>
        <div class="fg">
          <label class="f">Pourashava name<input id="fpn" list="pnl" /></label
          ><datalist id="pnl"></datalist>
          <label
            >Type<select id="fpy">
              <option>Holding</option>
              <option>Trade</option>
            </select></label
          ><label>Stage<select id="fpg"></select></label>
          <label class="f">Status<select id="fpx"></select></label>
        </div>
        <div class="mb">
          <button class="btn" id="pcx">Cancel</button
          ><button class="btn pri" id="psv">Save</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>

                  /^entry file ready/i.test(String(v || "").trim()),

              );
            });
          if (ps) {
            const r = pfromRows(
              XLSX.utils.sheet_to_json(wb.Sheets[ps], {
                header: 1,
                defval: null,
              }),
            );
            if (r.length) {
              P = r;
              p = r.length;
            }
          }
          if (!m && !p) throw 0;
          mut();
          toast(`Imported ${m} MRAS + ${p} pipeline records`, () => {
            D = oD;
            P = oP;
            mut();
          });
        } catch (x) {
          toast("Could not read that workbook");
        }
        e.target.value = "";
      };
      function pSheet(wb) {
        const a = [[], []];
        ST.forEach((s, i) => {
          const c = COLS[i];
          a[0][c] = s.x;
          a[1][c] = i ? "Sl" : "Count";
          a[1][c + 1] = "Name";
          if (i) a[1][c + 2] = "Status";
          P.filter((d) => d.stage === i).forEach((d, k) => {
            const r = (a[k + 2] = a[k + 2] || []);
            r[c] = k + 1;
            r[c + 1] = d.name + " " + d.type;
            if (i) r[c + 2] = d.status;
          });
        });
        const ws = XLSX.utils.aoa_to_sheet(
          a.map((r) => Array.from(r, (v) => v ?? null)),
        );
        ws["!merges"] = COLS.map((c, i) => ({
          s: { r: 0, c },
          e: { r: 0, c: i ? c + 2 : c + 1 },
        }));
        ws["!cols"] = Array.from({ length: 19 }, () => ({ wch: 24 }));
        XLSX.utils.book_append_sheet(wb, ws, "Pipeline");
      }

      render();
    </script>
  </body>
